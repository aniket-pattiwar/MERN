<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <filter id="shadowVdom" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="460" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">How React's Virtual DOM &amp; Reconciliation Works</text>

  <!-- Step 1: Previous Virtual DOM -->
  <g transform="translate(40, 80)">
    <rect width="240" height="340" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadowVdom)"/>
    <rect width="240" height="40" rx="12" fill="#21262d"/>
    <text x="120" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">1. Previous Virtual DOM</text>
    
    <!-- Tree nodes -->
    <circle cx="120" cy="80" r="22" fill="#1f6feb"/>
    <text x="120" y="85" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle">&lt;App&gt;</text>
    
    <line x1="120" y1="102" x2="70" y2="150" stroke="#8b949e" stroke-width="2"/>
    <line x1="120" y1="102" x2="170" y2="150" stroke="#8b949e" stroke-width="2"/>
    
    <circle cx="70" cy="165" r="20" fill="#238636"/>
    <text x="70" y="170" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">&lt;Nav&gt;</text>
    
    <circle cx="170" cy="165" r="20" fill="#238636"/>
    <text x="170" y="170" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">&lt;Card&gt;</text>

    <line x1="170" y1="185" x2="170" y2="235" stroke="#8b949e" stroke-width="2"/>
    <rect x="130" y="240" width="80" height="32" rx="6" fill="#30363d"/>
    <text x="170" y="260" font-family="monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Count: 5</text>
  </g>

  <!-- Diffing Arrow -->
  <text x="325" y="240" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f59e0b" text-anchor="middle">&rarr;</text>
  <text x="325" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">State Change</text>

  <!-- Step 2: New Virtual DOM -->
  <g transform="translate(340, 80)">
    <rect width="240" height="340" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadowVdom)"/>
    <rect width="240" height="40" rx="12" fill="#21262d"/>
    <text x="120" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f0883e" text-anchor="middle">2. New Virtual DOM</text>
    
    <!-- Tree nodes -->
    <circle cx="120" cy="80" r="22" fill="#1f6feb"/>
    <text x="120" y="85" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle">&lt;App&gt;</text>
    
    <line x1="120" y1="102" x2="70" y2="150" stroke="#8b949e" stroke-width="2"/>
    <line x1="120" y1="102" x2="170" y2="150" stroke="#8b949e" stroke-width="2"/>
    
    <circle cx="70" cy="165" r="20" fill="#238636"/>
    <text x="70" y="170" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">&lt;Nav&gt;</text>
    
    <circle cx="170" cy="165" r="20" fill="#238636"/>
    <text x="170" y="170" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">&lt;Card&gt;</text>

    <line x1="170" y1="185" x2="170" y2="235" stroke="#f85149" stroke-width="3"/>
    <rect x="130" y="240" width="80" height="32" rx="6" fill="#da3633" stroke="#f85149" stroke-width="2"/>
    <text x="170" y="260" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Count: 6 ✨</text>
    
    <rect x="30" y="290" width="180" height="30" rx="6" fill="#21262d"/>
    <text x="120" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">Diff: Only Count Changed!</text>
  </g>

  <!-- Patch Arrow -->
  <text x="625" y="240" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#3fb950" text-anchor="middle">&rarr;</text>
  <text x="625" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Batch Patch</text>

  <!-- Step 3: Real Browser DOM -->
  <g transform="translate(640, 80)">
    <rect width="240" height="340" rx="12" fill="#161b22" stroke="#238636" stroke-width="2" filter="url(#shadowVdom)"/>
    <rect width="240" height="40" rx="12" fill="#238636"/>
    <text x="120" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Real Browser DOM</text>
    
    <text x="120" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Browser HTML Layout</text>
    
    <rect x="25" y="90" width="190" height="220" rx="8" fill="#0d1117" stroke="#30363d"/>
    <rect x="40" y="110" width="160" height="35" rx="4" fill="#21262d"/>
    <text x="120" y="132" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">&lt;header&gt; (Untouched)</text>
    
    <rect x="40" y="160" width="160" height="130" rx="6" fill="#21262d"/>
    <text x="120" y="182" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">&lt;section&gt;</text>
    
    <rect x="55" y="200" width="130" height="40" rx="6" fill="#238636" stroke="#3fb950" stroke-width="2"/>
    <text x="120" y="225" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;span&gt;6&lt;/span&gt;</text>
    <text x="120" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">✔ Only this node updated!</text>
  </g>
</svg>