<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <rect width="900" height="440" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">React Hooks: useState &amp; useEffect Execution Lifecycle</text>

  <!-- Step 1 -->
  <g transform="translate(50, 90)">
    <rect width="170" height="290" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <rect width="170" height="40" rx="10" fill="#1f6feb"/>
    <text x="85" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1. Component Mount</text>
    
    <text x="85" y="70" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">useState(0)</text>
    <rect x="20" y="90" width="130" height="50" rx="6" fill="#21262d"/>
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Initializes state</text>
    <text x="85" y="128" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">count = 0</text>
    
    <text x="85" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">First Render</text>
    <rect x="20" y="200" width="130" height="45" rx="6" fill="#21262d"/>
    <text x="85" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Displays UI on screen</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <text x="245" y="230" font-family="system-ui, sans-serif" font-size="24" fill="#58a6ff" text-anchor="middle">&rarr;</text>

  <!-- Step 2 -->
  <g transform="translate(270, 90)">
    <rect width="170" height="290" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <rect width="170" height="40" rx="10" fill="#238636"/>
    <text x="85" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2. useEffect Runs</text>
    
    <text x="85" y="70" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">useEffect(..., [])</text>
    <rect x="20" y="90" width="130" height="90" rx="6" fill="#21262d"/>
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Runs AFTER render</text>
    <text x="85" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">1. Fetches API data</text>
    <text x="85" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">2. Sets up listeners</text>
    <text x="85" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">3. Syncs storage</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <text x="465" y="230" font-family="system-ui, sans-serif" font-size="24" fill="#f59e0b" text-anchor="middle">&rarr;</text>

  <!-- Step 3 -->
  <g transform="translate(490, 90)">
    <rect width="170" height="290" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <rect width="170" height="40" rx="10" fill="#d29922"/>
    <text x="85" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3. User Action</text>
    
    <text x="85" y="70" font-family="monospace" font-size="11" fill="#f0883e" text-anchor="middle">setCount(count + 1)</text>
    <rect x="20" y="90" width="130" height="90" rx="6" fill="#21262d"/>
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">User clicks button</text>
    <text x="85" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">State updates</text>
    <text x="85" y="152" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">count = 1</text>
    <text x="85" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Triggers Re-render</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <text x="685" y="230" font-family="system-ui, sans-serif" font-size="24" fill="#a855f7" text-anchor="middle">&rarr;</text>

  <!-- Step 4 -->
  <g transform="translate(710, 90)">
    <rect width="170" height="290" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
    <rect width="170" height="40" rx="10" fill="#8957e5"/>
    <text x="85" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4. Re-render UI</text>
    
    <text x="85" y="70" font-family="monospace" font-size="11" fill="#d2a8ff" text-anchor="middle">&lt;Count&gt;1&lt;/Count&gt;</text>
    <rect x="20" y="90" width="130" height="90" rx="6" fill="#21262d"/>
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">React compares VDOM</text>
    <text x="85" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">Updates only number</text>
    <text x="85" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">UI reflects state</text>
    <text x="85" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Smooth 60fps update</text>
  </g>
</svg>