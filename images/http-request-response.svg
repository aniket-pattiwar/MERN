<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="reqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Anatomy of an HTTP Request &amp; Response Cycle</text>

  <!-- Client Box -->
  <rect x="50" y="90" width="220" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="90" width="220" height="45" rx="12" fill="url(#reqGrad)"/>
  <text x="160" y="118" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Client (Browser / Postman)</text>

  <text x="160" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">1. Initiates HTTP Request</text>
  <rect x="65" y="190" width="190" height="150" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="75" y="215" font-family="monospace" font-size="11" fill="#38bdf8">GET /api/books HTTP/1.1</text>
  <text x="75" y="240" font-family="monospace" font-size="10" fill="#94a3b8">Host: localhost:5000</text>
  <text x="75" y="260" font-family="monospace" font-size="10" fill="#94a3b8">Accept: application/json</text>
  <text x="75" y="280" font-family="monospace" font-size="10" fill="#94a3b8">Authorization: Bearer ...</text>
  <text x="75" y="315" font-family="monospace" font-size="10" fill="#64748b">[Body: JSON payload]</text>

  <!-- Server Box -->
  <rect x="630" y="90" width="220" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="630" y="90" width="220" height="45" rx="12" fill="url(#resGrad)"/>
  <text x="740" y="118" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Server (Node &amp; Express)</text>

  <text x="740" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0" text-anchor="middle">2. Returns HTTP Response</text>
  <rect x="645" y="190" width="190" height="150" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="655" y="215" font-family="monospace" font-size="11" fill="#4ade80">HTTP/1.1 200 OK</text>
  <text x="655" y="240" font-family="monospace" font-size="10" fill="#94a3b8">Content-Type: app/json</text>
  <text x="655" y="260" font-family="monospace" font-size="10" fill="#94a3b8">Status: 200 (Success)</text>
  <text x="655" y="290" font-family="monospace" font-size="10" fill="#facc15">[Body: [{ id: 1, ... }]]</text>
  <text x="655" y="315" font-family="monospace" font-size="10" fill="#64748b">res.json() closes stream</text>

  <!-- Request Arrow (Top) -->
  <path d="M 275 160 L 620 160" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="620,160 610,154 610,166" fill="#38bdf8"/>
  <rect x="360" y="140" width="180" height="26" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="450" y="157" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">HTTP Request &rarr;</text>

  <!-- Response Arrow (Bottom) -->
  <path d="M 625 280 L 280 280" stroke="#4ade80" stroke-width="3"/>
  <polygon points="280,280 290,274 290,286" fill="#4ade80"/>
  <rect x="360" y="267" width="180" height="26" rx="6" fill="#0f172a" stroke="#4ade80"/>
  <text x="450" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">&larr; HTTP Response</text>
</svg>